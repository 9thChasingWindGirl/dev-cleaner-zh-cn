name: 同步上游并发布汉化版

'on':
  schedule:
    # 每周一 03:00 UTC（北京时间周一 11:00）自动运行
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（commit SHA / tag / 分支名）'
        required: false
        default: 'main'
      upstream_file:
        description: '上游仓库内要汉化的文件路径'
        required: false
        default: 'dev-cleaner.ps1'

permissions:
  contents: write

concurrency:
  group: sync-upstream-zh-cn
  cancel-in-progress: false

env:
  UPSTREAM_REPO: jemishavasoya/dev-cleaner
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
  UPSTREAM_FILE: ${{ inputs.upstream_file || 'dev-cleaner.ps1' }}
  TRANSLATED_FILE: dev-cleaner.zh-CN.ps1
  # 汉化版 README 直接作为仓库根 README.md（头部含来源声明 + how2use.md 指引）
  TRANSLATED_README: README.md

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载上游源文件
        run: |
          mkdir -p upstream
          curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}/${UPSTREAM_FILE}" \
            -o upstream/dev-cleaner.ps1
          curl -fsSL "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_REF}/README.md" \
            -o upstream/README.md
          printf '%s\n' "${UPSTREAM_REF}" > upstream-ref.txt
          echo "已下载上游 ${UPSTREAM_REF}"
          echo "  脚本行数: $(wc -l < upstream/dev-cleaner.ps1)"
          echo "  README 行数: $(wc -l < upstream/README.md)"

      - name: LLM 汉化（ps1 + README，任一失败即任务失败）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 备用模型：主模型失败/超时后自动切换
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          # 最大输出 token 数
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          # 每个文本段重试轮数：每轮依次尝试 primary -> fallback
          LLM_MAX_ROUNDS: ${{ vars.LLM_MAX_ROUNDS }}
          # 同一模型单轮内的重试次数（默认 0 = 不重试，每个模型仅尝试一次）
          LLM_RETRIES: ${{ vars.LLM_RETRIES }}
          # 单次请求超时（秒）
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          # 0 = 不切段整文件一次提交（适合 512K 上下文模型）
          LLM_CHUNK_LINES: ${{ vars.LLM_CHUNK_LINES }}
          # SMTP 告警（轮次耗尽仍未成功时发邮件通知）；账号与收件人属隐私，从 Secrets 读取
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: |
          # ps1 汉化（核心产物，失败即任务失败）
          python scripts/translate.py \
            --input upstream/dev-cleaner.ps1 \
            --output "${TRANSLATED_FILE}"
          # README 汉化，头部声明源代码来源 + 上游仓库 + 本仓库使用说明 how2use.md
          # （任一汉化失败都会使本步骤失败 -> 任务失败，不发布）
          README_HEADER=$(printf '> **汉化声明**：本 README 由 GitHub Actions 自动汉化自上游仓库 [jemishavasoya/dev-cleaner](https://github.com/jemishavasoya/dev-cleaner) 的 `README.md`（上游 ref：`%s`）。\n>\n> - 上游仓库：https://github.com/jemishavasoya/dev-cleaner\n> - 原始文件：https://github.com/jemishavasoya/dev-cleaner/blob/%s/README.md\n> - 本仓库（dev-cleaner-zh-cn）使用与配置说明：**[how2use.md](how2use.md)**\n\n---\n' "${UPSTREAM_REF}" "${UPSTREAM_REF}")
          python scripts/translate.py \
            --input upstream/README.md \
            --output "${TRANSLATED_README}" \
            --kind md \
            --header "${README_HEADER}"

      - name: 检查翻译结果是否有变化
        id: check
        run: |
          changed=false
          for f in "${TRANSLATED_FILE}" "${TRANSLATED_README}"; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1 \
               || ! git diff --quiet HEAD -- "$f"; then
              changed=true
              break
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "翻译结果有变化，准备发布"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "翻译结果与上次一致，无需发布新 Release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 计算版本与标签
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="$(grep -oE '\$SCRIPT_VERSION = "[^"]+"' "${TRANSLATED_FILE}" | head -1 | sed 's/.*"\(.*\)"/\1/')"
          [ -n "$VERSION" ] || VERSION="0.0.0"
          DATE="$(date -u +%Y-%m-%d)"
          TAG="zh-CN-v${VERSION}-$(date -u +%Y%m%d)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 提交汉化文件
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${TRANSLATED_FILE}" "${TRANSLATED_README}" \
            upstream/dev-cleaner.ps1 upstream/README.md upstream-ref.txt
          git commit -m "chore: 同步上游 ${UPSTREAM_REF}，发布汉化版 v${{ steps.version.outputs.version }}"
          git push origin HEAD

      - name: 创建 GitHub Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dev Cleaner 汉化版 v${{ steps.version.outputs.version }}
          body: |
            ## Dev Cleaner 汉化版 v${{ steps.version.outputs.version }}

            - 上游仓库：[jemishavasoya/dev-cleaner](https://github.com/jemishavasoya/dev-cleaner)
            - 上游 ref：[${{ env.UPSTREAM_REF }}](https://github.com/${{ env.UPSTREAM_REPO }}/tree/${{ env.UPSTREAM_REF }})
            - 汉化时间：${{ steps.version.outputs.date }}
            - 说明：由 GitHub Actions 自动同步上游并调用 LLM 汉化；用户可见文本已译为简体中文，代码逻辑与上游保持一致。

            ### 附件
            - `dev-cleaner.zh-CN.ps1` — 汉化版脚本（UTF-8 BOM，适用于 Windows PowerShell 5.1+）
            - `README.md` — 汉化版说明文档（即仓库根 README，头部含来源声明与使用说明指引）
            - `upstream/dev-cleaner.ps1` — 上游原始脚本（供对照）
            - `upstream/README.md` — 上游原始说明文档（供对照）
          files: |
            dev-cleaner.zh-CN.ps1
            README.md
            upstream/dev-cleaner.ps1
            upstream/README.md
